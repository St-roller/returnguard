<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ReturnGuard · 180例结构化审查</title>
<style>body{font:16px system-ui;margin:24px auto;max-width:1080px;background:#f7f8fa;color:#192334}textarea{width:98%;min-height:90px;font:16px system-ui}button,select,input{font:inherit;padding:7px;margin:4px}section{background:white;padding:20px;margin:16px 0;border:1px solid #d3dae4;border-radius:8px}.warn{color:#ae3000}pre{white-space:pre-wrap;font-size:13px}label{display:block;margin:8px 0}.badge{background:#e9eef6;padding:8px}summary{cursor:pointer}.pair{border-top:1px solid #ddd;padding:12px}#checks input{margin-right:8px}</style>
<h1>ReturnGuard 结构化案例审查</h1><p>中文是唯一模型输入；英文仅为注释。每例保留 13 项检查和具体审查记录；预检通过不等于批准。此页面不会调用 API 或上传内容。</p>
<section><label>审查方法版本 <input id="name" placeholder="请输入真实审查方法版本"></label><button id="export">导出审核 JSON</button><label>导入已有审核进度 <input type="file" id="import" accept=".json"></label><p>进度自动保存在本浏览器；请定期导出备份。修改中文或英文后，需要将导出的 JSON 交回 Work 重新运行审计；再审核新的审计结果。</p><div id="progress"></div></section>
<section><button id="prev">上一例</button><select id="nav"></select><button id="next">下一例</button><h2 id="title"></h2><div id="issue" class="warn"></div><pre id="design"></pre>
<label>中文顾客消息<textarea id="message"></textarea></label><label>英文注释<textarea id="english"></textarea></label><div id="fields"></div>
<details><summary>原始响应截断内容（仅供修订参考）</summary><pre id="raw"></pre></details>
<div id="checks"></div><label>发现问题（每行一项）<textarea id="issues"></textarea></label><label>修复记录（每行一项）<textarea id="repairs"></textarea></label><label>审核说明<textarea id="notes"></textarea></label><button id="approve">批准当前案例</button><button id="revision">标记需要修订</button><div id="validation" class="warn"></div></section>
<section><h2>重复与泄漏审计</h2><pre id="audit"></pre><p>精确重复必须修订。相似对可以有理由地确认 distinct，也可以修订后重新审计；旧消息的相似对结论不会应用于新消息。</p><div id="pairs"></div>
<label><input type="checkbox" id="format">已检查按 route 分组的长度、句数、标点、emoji 与重复开头，无明显标签暗示</label>
<label><input type="checkbox" id="annotation">已检查英文注释中的所有疑似标签与生成器痕迹</label>
<label><input type="checkbox" id="inputflags">已检查中文疑似标签词；商品“标签”等自然表达不是 route 泄漏</label><button id="attest">确认当前审计快照</button><div id="atteststatus"></div></section>
<script id="packet" type="application/json">__PACKET_JSON__</script><script>
const P=JSON.parse(document.getElementById('packet').textContent), $=id=>document.getElementById(id), key='returnguard-review-'+P.initial.source_drafts_sha256;
let state=structuredClone(P.initial), idx=0; try {const s=JSON.parse(localStorage.getItem(key));if(s?.source_drafts_sha256===state.source_drafts_sha256)state=s;}catch{}
const checks=['中文表达符合预定难度、语气、长度和语言特征','表达预定退货原因与 reason family','吊牌状态有支持','污损/破损状态有支持','是否超出合理检查/试穿有支持','gold 不包含消息中不支持的事实','全部证据是逐字中文子串','unknown + [] 仅用于缺失信息','unknown + evidence 仅用于明确不确定','conflicting 有两个不同且尚未解决的矛盾证据','英文注释忠实，不代替中文输入','没有 route/rule 标签或生成器痕迹','消息和证据与蓝图事实一致，Policy v1 的预定 route/rule 不变'];
for(const d of P.drafts)if(!state.reviews.some(r=>r.case_id===d.case_id))state.reviews.push({case_id:d.case_id,customer_message:d.customer_message,english_annotation:d.english_annotation,extraction:structuredClone(d.extraction),review_status:'pending',review_method_version:null,reviewed_at:null,review_round:1,review_notes:'',issues_found:[],issue_categories:[],repairs_made:[],checklist_confirmed:false,checklist_items:checks.map(()=>false)});
state.pair_decisions??={};state.audit_attestation??={};
function canonical(v){if(Array.isArray(v))return '['+v.map(canonical).join(', ')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+': '+canonical(v[k])).join(', ')+'}';return JSON.stringify(v)}
async function reviewDigest(v){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical(v))))).map(x=>x.toString(16).padStart(2,'0')).join('')}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}$('progress').textContent=`批准 ${state.reviews.filter(x=>x.review_status==='approved').length}/180；尚未冻结`}
function current(){return state.reviews.find(r=>r.case_id===P.drafts[idx].case_id)}
function changed(){const r=current();r.review_status='pending';r.reviewed_at=null;r.checklist_confirmed=false;r.checklist_items=checks.map(()=>false);state.audit_attestation={};save()}
function render(){const d=P.drafts[idx],r=current();$('nav').value=idx;$('title').textContent=d.case_id+' · '+r.review_status;$('issue').textContent=d.preflight_issues.join('；');$('design').textContent=JSON.stringify({order_facts:d.blueprint.trusted_order_facts,intended_facts:d.blueprint.intended_extraction,target:d.blueprint.target,design:d.blueprint.generation_constraints},null,2);$('message').value=r.customer_message;$('english').value=r.english_annotation;$('notes').value=r.review_notes;$('issues').value=(r.issues_found||[]).join('\n');$('repairs').value=(r.repairs_made||[]).join('\n');$('raw').textContent=d.unparsed_generator_content||'无';$('fields').replaceChildren();
for(const [name,f] of Object.entries(r.extraction)){const l=document.createElement('label');l.textContent=name+' = '+f.value+'（每行一个原文证据；空白表示 []）';const t=document.createElement('textarea');t.value=f.evidence.join('\n');t.oninput=()=>{f.evidence=t.value.split('\n').filter(x=>x.length);changed();renderChecks()};l.append(t);$('fields').append(l)}renderChecks();$('validation').textContent='';save()}
function renderChecks(){$('checks').replaceChildren();checks.forEach((text,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=current().checklist_items?.[i]||false;c.onchange=()=>{current().checklist_items??=checks.map(()=>false);current().checklist_items[i]=c.checked;current().review_status='pending';save()};l.append(c,document.createTextNode((i+1)+'. '+text));$('checks').append(l)})}
P.drafts.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=d.case_id+(d.preflight_issues.length?' ⚠':'');$('nav').append(o)});
$('nav').onchange=()=>{idx=Number($('nav').value);render()};$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('next').onclick=()=>{idx=Math.min(179,idx+1);render()};
for(const [id,field]of [['message','customer_message'],['english','english_annotation']])$(id).oninput=()=>{current()[field]=$(id).value;changed();renderChecks()};$('notes').oninput=()=>{current().review_notes=$('notes').value;save()};$('name').value='structured_case_review_v1.1';for(const [id,field] of [['issues','issues_found'],['repairs','repairs_made']])$(id).oninput=()=>{current()[field]=$(id).value.split('\n').filter(Boolean);save()};
$('approve').onclick=async()=>{const r=current(),errors=[];if(!$('name').value.trim())errors.push('需要审查方法版本');if(!r.customer_message.trim()||!r.english_annotation.trim())errors.push('中文/英文不能为空');if(!r.checklist_items.every(Boolean))errors.push('必须逐项完成 13 项检查');for(const [n,f]of Object.entries(r.extraction)){if(f.evidence.some(e=>!e||!r.customer_message.includes(e)))errors.push(n+' 证据不是逐字子串');if(!['unknown','not_stated'].includes(f.value)&&!f.evidence.length)errors.push(n+' 缺少证据');if(f.value==='conflicting'&&new Set(f.evidence).size<2)errors.push(n+' 必须有两个不同证据')}$('validation').textContent=errors.join('；');if(errors.length)return;if(!r.review_notes.trim()){$('validation').textContent='需要本例的具体审查说明';return}r.reviewed_content_sha256=await reviewDigest({customer_message:r.customer_message,english_annotation:r.english_annotation,extraction:r.extraction});r.review_status='approved';r.checklist_confirmed=true;r.review_method_version=$('name').value.trim();r.reviewed_at=new Date().toISOString();save();render()};
$('revision').onclick=()=>{current().review_status='needs_revision';current().review_method_version=$('name').value.trim();current().reviewed_at=new Date().toISOString();save();render()};
$('audit').textContent=JSON.stringify(P.audit,null,2);
for(const pair of P.audit.near_duplicate_pairs){const box=document.createElement('div');box.className='pair';const a=state.reviews.find(r=>r.case_id===pair.case_a),b=state.reviews.find(r=>r.case_id===pair.case_b),p=document.createElement('pre');p.textContent=`${pair.case_a} / ${pair.case_b} · ${pair.scope}\n${a.customer_message}\n${b.customer_message}`;const notes=document.createElement('textarea');notes.placeholder='为什么它们可以作为独立案例？';notes.value=state.pair_decisions[pair.pair_id]?.notes||'';const btn=document.createElement('button');btn.textContent='确认是可接受的不同案例';btn.onclick=()=>{if(!$('name').value.trim()||!notes.value.trim())return;state.pair_decisions[pair.pair_id]={decision:'accepted_distinct',notes:notes.value,review_method_version:$('name').value.trim(),reviewed_at:new Date().toISOString()};btn.textContent='已确认';save()};box.append(p,notes,btn);$('pairs').append(box)}
$('attest').onclick=()=>{if(!$('name').value.trim()||!['format','annotation','inputflags'].every(id=>$(id).checked))return;const edited=state.reviews.some(r=>{const d=P.drafts.find(x=>x.case_id===r.case_id),old=P.initial.reviews.find(x=>x.case_id===r.case_id)||d;return r.customer_message!==old.customer_message||r.english_annotation!==old.english_annotation});if(edited){$('atteststatus').textContent='消息已修改：请导出并交回 Work 重新审计，再确认新快照。';return}state.audit_attestation={review_method_version:$('name').value.trim(),reviewed_at:new Date().toISOString(),formatting_checked:true,annotation_flags_checked:true,input_flags_checked:true,dataset_snapshot_sha256:P.audit.dataset_snapshot_sha256};$('atteststatus').textContent='已确认当前审计快照';save()};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='returnguard_structured_reviews.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onchange=async()=>{const s=JSON.parse(await $('import').files[0].text());if(s.source_drafts_sha256!==state.source_drafts_sha256){alert('来源快照不匹配');return}localStorage.setItem(key,JSON.stringify(s));location.reload()};render();
</script></html>
